server:
  port: ${PORT:2333}
  address: 0.0.0.0
  http2:
    enabled: false

plugins:
  youtube:
    enabled: true
    allowSearch: true
    allowDirectVideoIds: true
    allowDirectPlaylistIds: true
    clients:
      - MUSIC
      - ANDROID_TESTSUITE
      - WEB
      - TVHTML5EMBEDDED
    WEB:
      playback: false
    TVHTML5EMBEDDED:
      playlistLoading: false
      videoLoading: false
      searching: false

  lavasrc:
    providers:
      - "ytsearch:\"%ISRC%\""
      - "ytsearch:%QUERY%"
      - "scsearch:%QUERY%"
    sources:
      spotify: false
      appleMusic: false
      deezer: false
      yandexMusic: false
      vkMusic: false
      tidal: false
      flowerytts: false
      youtube: true
      jiosaavn: false
    spotify:
      clientId: "YOUR_SPOTIFY_CLIENT_ID"
      clientSecret: "YOUR_SPOTIFY_CLIENT_SECRET"
      countryCode: "US"
      playlistLoadLimit: 6
      albumLoadLimit: 6
      artistLoadLimit: 6
      resolveArtistsInSearch: true
      localFiles: false
    appleMusic:
      countryCode: "US"
      mediaAPIToken: "YOUR_APPLE_MUSIC_TOKEN"
      playlistLoadLimit: 6
      albumLoadLimit: 6
    deezer:
      masterDecryptionKey: "YOUR_DEEZER_MASTER_KEY"
      arl: "YOUR_DEEZER_ARL"
      formats:
        - FLAC
        - MP3_320
        - MP3_256
        - MP3_128
        - MP3_64
        - AAC_64
    yandexMusic:
      accessToken: "YOUR_YANDEX_TOKEN"
      playlistLoadLimit: 6
      albumLoadLimit: 6
      artistLoadLimit: 6
    vkMusic:
      userToken: "YOUR_VK_TOKEN"
      playlistLoadLimit: 6
      albumLoadLimit: 6
      artistLoadLimit: 10
    tidal:
      countryCode: "US"
      playlistLoadLimit: 6
      albumLoadLimit: 6
      artistLoadLimit: 6

  lavasearch:
    sources:
      - youtube
      - youtubemusic
      - soundcloud

lavalink:
  plugins:
    - dependency: "dev.lavalink.youtube:youtube-plugin:1.18.2"
      snapshot: false
    - dependency: "com.github.topi314.lavasrc:lavasrc-plugin:4.8.3"
      snapshot: false
    - dependency: "com.github.topi314.lavasearch:lavasearch-plugin:1.0.0"
      snapshot: false
  server:
    password: "${LAVALINK_SERVER_PASSWORD:youshallnotpass}"
    sources:
      youtube: false        # dihandle oleh youtube-plugin
      bandcamp: true
      soundcloud: true
      twitch: true
      vimeo: true
      nico: true
      http: true
      local: false
    filters:
      volume: true
      equalizer: true
      karaoke: true
      timescale: true
      tremolo: true
      vibrato: true
      distortion: true
      rotation: true
      channelMix: true
      lowPass: true
    bufferDurationMs: 400
    frameBufferDurationMs: 5000
    opusEncodingQuality: 10
    resamplingQuality: LOW
    trackStuckThresholdMs: 10000
    useSeekGhosting: true
    youtubePlaylistLoadLimit: 6
    playerUpdateInterval: 5
    youtubeSearchEnabled: true
    soundcloudSearchEnabled: true
    gc-warnings: true

metrics:
  prometheus:
    enabled: false
    endpoint: /metrics

sentry:
  dsn: ""
  environment: ""

logging:
  file:
    path: ./logs/
  level:
    root: INFO
    lavalink: INFO
  request:
    enabled: true
    includeClientInfo: true
    includeHeaders: false
    includeQueryString: true
    includePayload: true
    maxPayloadLength: 10000
